# nginx.conf — Smart ANPR System production reverse proxy
# Place this in /etc/nginx/sites-available/anpr and symlink to sites-enabled/
#
# Prerequisites:
#   1. SSL certificate at /etc/ssl/anpr/fullchain.pem and privkey.pem
#   2. Backend running: venv/bin/python3 -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000
#   3. Frontend built: cd smart-anpr-dashboard && npm run build
#      (dist/ is served by the FastAPI SPA fallback — no separate nginx static needed)
#
# Reload: sudo nginx -t && sudo systemctl reload nginx

upstream anpr_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/ssl/anpr/fullchain.pem;
    ssl_certificate_key /etc/ssl/anpr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                           always;
    add_header X-Content-Type-Options     nosniff                                        always;
    add_header Referrer-Policy            strict-origin-when-cross-origin                always;

    client_max_body_size 20M;

    # ── WebSocket (live camera feed) ────────────────────────────
    location /ws {
        proxy_pass         http://anpr_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── MJPEG stream ────────────────────────────────────────────
    location /camera/ {
        proxy_pass         http://anpr_backend;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
    }

    # ── All other traffic → FastAPI ─────────────────────────────
    location / {
        proxy_pass         http://anpr_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
