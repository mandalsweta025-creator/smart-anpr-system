# nginx/nginx.conf — Docker Compose internal proxy
# Listens on port 80, proxies all traffic to the anpr container.
# For SSL termination, put a reverse proxy (Caddy/nginx on the host) in front,
# or add a certbot-based overlay on top of this compose stack.

upstream anpr_backend {
    server anpr:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # WebSocket — live camera feed
    location /ws {
        proxy_pass         http://anpr_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MJPEG stream — disable buffering so frames arrive in real time
    location /camera/ {
        proxy_pass         http://anpr_backend;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
    }

    # Everything else
    location / {
        proxy_pass         http://anpr_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
